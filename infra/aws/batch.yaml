            --==PANBIOME==--

  # On-demand only. MinvCpus 0: Batch terminates instances once no job needs them, so nothing runs while idle.
  OnDemandComputeEnv:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        MaxvCpus: !Ref MaxOnDemandVcpus
        InstanceTypes: [m7i, r7i]
        Subnets: !Ref SubnetIds
        SecurityGroupIds: [!Ref BatchSecurityGroup]
        InstanceRole: !GetAtt InstanceProfile.Arn
        Ec2Configuration:
          - ImageType: ECS_AL2023
        LaunchTemplate:
          LaunchTemplateId: !Ref LaunchTemplate
          Version: !GetAtt LaunchTemplate.LatestVersionNumber
        Tags: { project: panbiome-gut-ont }

  BuildComputeEnv:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        MaxvCpus: !Ref MaxOnDemandVcpus
        InstanceTypes: [r7i, r6i]
        Subnets: !Ref SubnetIds
        SecurityGroupIds: [!Ref BatchSecurityGroup]
        InstanceRole: !GetAtt InstanceProfile.Arn
        Ec2Configuration:
          - ImageType: ECS_AL2023
        LaunchTemplate:
          LaunchTemplateId: !Ref BuildLaunchTemplate
          Version: !GetAtt BuildLaunchTemplate.LatestVersionNumber
        Tags: { project: panbiome-gut-ont }

  DefaultQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: panbiome-default
      Priority: 1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref OnDemandComputeEnv

  OnDemandQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: panbiome-ondemand
      Priority: 1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref OnDemandComputeEnv

  BuildQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: panbiome-build
      Priority: 1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref BuildComputeEnv

Outputs:
  Bucket:
    Value: !Ref DataBucket
  CoreImageUri:
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${CoreImageRepo}'
  JobRoleArn:
    Value: !GetAtt JobRole.Arn
  HeadJobDefinition:
    Value: !Ref HeadJobDefinition
  DefaultQueue:
    Value: !Ref DefaultQueue
  OnDemandQueue:
    Value: !Ref OnDemandQueue
