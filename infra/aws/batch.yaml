AWSTemplateFormatVersion: '2010-09-09'
Description: panbiome-gut-ont on AWS Batch - S3 bucket, ECR repository, IAM roles, compute environments and job queues.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets with a route to the internet (tasks pull images and Medaka weights).
  MaxOnDemandVcpus:
    Type: Number
    Default: 32
    Description: Ceiling per compute environment; the account's running on-demand vCPU quota is shared by all of them.
  HeadTimeoutSeconds:
    Type: Number
    Default: 259200
    Description: A Nextflow head job that runs longer is stopped, so a hung run cannot keep machines up.
  RootVolumeGiB:
    Type: Number
    Default: 300
  BuildRootVolumeGiB:
    Type: Number
    Default: 1000
    Description: Disk for the one-off Kraken2 build, which writes about 450 GB of GTDB genomes.
  WorkExpiryDays:
    Type: Number
    Default: 14

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub panbiome-gut-ont-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-work
            Status: Enabled
            Prefix: work/
            ExpirationInDays: !Ref WorkExpiryDays
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub '${DataBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  CoreImageRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: panbiome-gut-ont-core
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true

  BucketAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ['s3:ListBucket', 's3:GetBucketLocation']
            Resource: !GetAtt DataBucket.Arn
          - Effect: Allow
            Action: ['s3:GetObject', 's3:PutObject', 's3:DeleteObject', 's3:AbortMultipartUpload', 's3:GetObjectTagging', 's3:PutObjectTagging']
            Resource: !Sub '${DataBucket.Arn}/*'

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - !Ref BucketAccessPolicy

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # Task containers get S3 credentials from the ECS agent through this role.
  JobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Ref BucketAccessPolicy

  # Nextflow itself runs as a Batch job (infra/aws/run.sh with PANBIOME_REMOTE=1) so long runs do not depend on a laptop session.
  HeadJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Ref BucketAccessPolicy
      Policies:
        - PolicyName: nextflow-head
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - batch:SubmitJob
                  - batch:DescribeJobs
                  - batch:ListJobs
                  - batch:TerminateJob
                  - batch:CancelJob
                  - batch:TagResource
                  - batch:RegisterJobDefinition
                  - batch:DescribeJobDefinitions
                  - batch:DescribeJobQueues
                  - batch:DescribeComputeEnvironments
                  - ecs:DescribeTasks
                  - ecs:DescribeContainerInstances
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeInstanceAttribute
                  - ec2:DescribeSpotInstanceRequests
                  - logs:GetLogEvents
                  - logs:DescribeLogStreams
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt JobRole.Arn

  HeadJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: panbiome-nextflow-head
      Type: container
      PlatformCapabilities: [EC2]
      RetryStrategy:
        Attempts: 1
      Timeout:
        AttemptDurationSeconds: !Ref HeadTimeoutSeconds
      ContainerProperties:
        Image: docker.io/nextflow/nextflow:26.10.4
        JobRoleArn: !GetAtt HeadJobRole.Arn
        Command: ['bash', '-c', 'echo "set the command when submitting"; exit 1']
        ResourceRequirements:
          - Type: VCPU
            Value: '2'
          - Type: MEMORY
            Value: '7000'
        Environment:
          - Name: NXF_ANSI_LOG
            Value: 'false'
        Volumes:
          - Name: aws-cli
            Host:
              SourcePath: /opt/aws-cli
        MountPoints:
          - SourceVolume: aws-cli
            ContainerPath: /opt/aws-cli
            ReadOnly: true

  BatchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: panbiome-gut-ont Batch instances, egress only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0

  # Nextflow stages task files with the host AWS CLI, mounted into each container.
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref RootVolumeGiB
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        UserData:
          Fn::Base64: |
            MIME-Version: 1.0
            Content-Type: multipart/mixed; boundary="==PANBIOME=="

            --==PANBIOME==
            Content-Type: text/x-shellscript; charset="us-ascii"

