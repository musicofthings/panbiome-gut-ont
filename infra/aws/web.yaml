AWSTemplateFormatVersion: '2010-09-09'
Description: panbiome-gut-ont run monitor - Cognito sign-in for lab staff, the FastAPI app on Lambda behind an HTTP API, and the web build on S3 + CloudFront. Deploy with infra/aws/deploy_web.sh.

Parameters:
  DataBucket:
    Type: String
    Description: Bucket output of the panbiome-gut-ont-batch stack. The API reads launch/, results/ and work/.
  CodeKey:
    Type: String
    Description: Key of the API's Lambda zip in DataBucket, uploaded by deploy_web.sh.
  AuthDomainPrefix:
    Type: String
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    Description: Prefix of the Cognito sign-in domain, <prefix>.auth.<region>.amazoncognito.com. Must be unique in the region.
  TaskQueues:
    Type: String
    Default: panbiome-default,panbiome-ondemand,panbiome-build
  HeadQueue:
    Type: String
    Default: panbiome-ondemand

Resources:
  # Invite-only: staff accounts are created by an administrator (docs/MONITOR.md). TOTP MFA is required
  # because sample sheets can carry patient metadata.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: panbiome-staff
      DeletionProtection: ACTIVE
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: 'ON'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags: { project: panbiome-gut-ont }

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref AuthDomainPrefix
      ManagedLoginVersion: 2

  # Public browser client: no secret, authorization code grant with PKCE.
  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: panbiome-monitor-web
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub 'https://${Distribution.DomainName}/auth/callback']
      LogoutURLs: [!Sub 'https://${Distribution.DomainName}/']
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 12
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: hours
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  # Managed login v2 shows no page for a client without a branding style.
  WebClientBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref WebClient
      UseCognitoProvidedValues: true

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-runs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucket}'
                Condition:
                  StringLike:
                    s3:prefix: [launch/*, results/*, work/*]
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${DataBucket}/launch/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${DataBucket}/results/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${DataBucket}/work/*'
              # ListJobs and DescribeJobs do not support resource-level permissions.
              - Effect: Allow
                Action: [batch:ListJobs, batch:DescribeJobs]
                Resource: '*'
              - Effect: Allow
                Action: logs:GetLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/batch/job:*'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ApiLogGroup.Arn
      Tags: [{ Key: project, Value: panbiome-gut-ont }]

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /panbiome/monitor-api
      RetentionInDays: 90

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: panbiome-gut-ont run monitor API (FastAPI)
      Runtime: python3.12
      Architectures: [arm64]
      Handler: panbiome_api.lambda_handler.handler
      Code:
        S3Bucket: !Ref DataBucket
        S3Key: !Ref CodeKey
      Role: !GetAtt ApiRole.Arn
      MemorySize: 512
      Timeout: 29
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          PANBIOME_ENV: production
          ALLOWED_ORIGINS: !Sub 'https://${Distribution.DomainName}'
          PANBIOME_BUCKET: !Ref DataBucket
          PANBIOME_REGION: !Ref AWS::Region
          PANBIOME_TASK_QUEUES: !Ref TaskQueues
          PANBIOME_HEAD_QUEUE: !Ref HeadQueue
          PANBIOME_LOG_GROUP: /aws/batch/job
      Tags: [{ Key: project, Value: panbiome-gut-ont }]

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: panbiome-monitor
      ProtocolType: HTTP
      Tags: { project: panbiome-gut-ont }

  # Rejects requests without a valid access token from WebClient before they reach Lambda.
  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito-staff
      AuthorizerType: JWT
      IdentitySource: [$request.header.Authorization]
      JwtConfiguration:
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
        Audience: [!Ref WebClient]

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'

  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/{proxy+}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ApiIntegration}'

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /panbiome/monitor-api-access
      RetentionInDays: 90

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","time":"$context.requestTime","route":"$context.routeKey","path":"$context.path","status":"$context.status","user":"$context.authorizer.claims.email","authError":"$context.authorizer.error","latencyMs":"$context.responseLatency"}'

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      Tags: [{ Key: project, Value: panbiome-gut-ont }]

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt SiteBucket.Arn, !Sub '${SiteBucket.Arn}/*']
            Condition:
              Bool: { aws:SecureTransport: 'false' }

  SiteOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Client-side routes such as /runs/<name> have no file in the bucket; serve index.html for them.
  # Done in a function rather than custom error responses, which would also rewrite the API's 403/404s.
  SpaRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-spa-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for paths without a file extension
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (!request.uri.split('/').pop().includes('.')) {
            request.uri = '/index.html';
          }
          return request;
        }

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
          ContentTypeOptions: { Override: true }
          FrameOptions: { Override: true, FrameOption: DENY }
          ReferrerPolicy: { Override: true, ReferrerPolicy: strict-origin-when-cross-origin }

  # CloudFront forwards Authorization only when it is in the cache key, and a policy with all TTLs 0 cannot
  # have one. The API sends no Cache-Control, so DefaultTTL 0 still means nothing is cached.
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-api'
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [Authorization]
          QueryStringsConfig: { QueryStringBehavior: all }
          CookiesConfig: { CookieBehavior: none }

  # One origin for the site and the API, so the browser calls /api/... on the same host and needs no CORS.
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: panbiome-gut-ont run monitor
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccess.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewrite.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: !Ref ApiCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeaders
      Tags: [{ Key: project, Value: panbiome-gut-ont }]

Outputs:
  SiteUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  SiteBucket:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  UserPoolId:
    Value: !Ref UserPool
  ClientId:
    Value: !Ref WebClient
  AuthDomain:
    Value: !Sub '${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
