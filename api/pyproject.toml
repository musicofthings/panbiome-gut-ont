[project]
name = "panbiome-api"
version = "0.1.0"
description = "Run monitor, report and file API for panbiome-gut-ont on AWS Batch"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "boto3>=1.35",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
lambda = ["mangum>=0.19"]

[tool.setuptools]
packages = ["panbiome_api"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
